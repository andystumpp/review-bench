<title>Review Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + source bar, then Map (place columns of component cards) or a Flow (summary rail + decision tree), detail sheet on the right. Tokens from Review Bench v16. */
:root {
  --bg:#0B0D10; --surface:#13161B; --surface2:#1A1E25; --line:#262B33; --line2:#3D444E;
  --ink:#EEF1F4; --muted:#9AA3AE; --dim:#4A525C;
  --mint:#5FD3A6; --coral:#FF7A6B; --violet:#B59CFF; --amber:#F5B544;
  --violetBg:#26213A; --amberBg:#2A2416; --hi:#1F2229;
  --glass:rgba(19,22,27,.94); --glassBar:rgba(11,13,16,.82); --shadow:rgba(0,0,0,.55);
  --glowA:rgba(245,181,68,.22); --glowV:rgba(181,156,255,.16); --gridLn:rgba(255,255,255,.035);
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#EEF0F3; --line:#E1E4E9; --line2:#C5CAD2;
  --ink:#14181D; --muted:#5B646E; --dim:#A6ADB5; --mint:#0E8A5F; --coral:#C43F2C; --violet:#6747B8; --amber:#B07114;
  --violetBg:#ECE7FA; --amberBg:#FBEFD6; --hi:#F3ECDC; --glass:rgba(255,255,255,.95); --glassBar:rgba(245,246,248,.86); --shadow:rgba(20,24,29,.14); --glowA:rgba(245,181,68,.35); --glowV:rgba(103,71,184,.14); --gridLn:rgba(20,24,29,.05);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#EEF0F3; --line:#E1E4E9; --line2:#C5CAD2;
  --ink:#14181D; --muted:#5B646E; --dim:#A6ADB5; --mint:#0E8A5F; --coral:#C43F2C; --violet:#6747B8; --amber:#B07114;
  --violetBg:#ECE7FA; --amberBg:#FBEFD6; --hi:#F3ECDC; --glass:rgba(255,255,255,.95); --glassBar:rgba(245,246,248,.86); --shadow:rgba(20,24,29,.14); --glowA:rgba(245,181,68,.35); --glowV:rgba(103,71,184,.14); --gridLn:rgba(20,24,29,.05);
  color-scheme: light; }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; }
button:focus-visible, input:focus-visible, label:focus-within { outline:2px solid var(--amber); outline-offset:2px; }
.mono { font-family:var(--mono); }
.eyebrow { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.wrap { max-width:1320px; margin:0 auto; padding-inline:clamp(16px,3vw,24px); }
header.top .wrap { max-width:1280px; }

/* header */
header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--glassBar); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.top .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding-block:14px; }
.logo { width:28px; height:28px; border-radius:9px; flex:none; position:relative; background:linear-gradient(135deg,#F5A94E 0%,#F2706E 52%,#9D7CF0 100%); box-shadow:0 4px 14px -4px color-mix(in srgb,#F2706E 60%,transparent), inset 0 1px 0 rgba(255,255,255,.35); }
.logo::after { content:'R'; position:absolute; inset:0; display:grid; place-items:center; font-family:var(--sans); font-size:16px; font-weight:800; letter-spacing:-.02em; line-height:1; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.18); }
.brand { font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
.brand span { font-weight:500; color:var(--muted); }
.pill { font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line2); border-radius:999px; padding:3px 10px; background:transparent; white-space:nowrap; }
button.pill { cursor:pointer; }
button.pill:hover { border-color:var(--amber); color:var(--ink); }
.progress { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:12px; color:var(--muted); min-width:0; flex:1 1 260px; }
.bar { flex:0 1 160px; height:6px; border-radius:6px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--mint),var(--amber)); width:0; transition:width .3s; }
#themeBtn::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--amber); margin-right:7px; vertical-align:1px; }
.srcpill { display:inline-flex; gap:6px; align-items:center; cursor:pointer; height:24px; }
.srcpill b { font-weight:600; color:var(--amber); }
.srcpill span { color:var(--ink); }
.srcpill:hover { border-color:var(--amber); }
.toast { position:fixed; left:16px; bottom:16px; z-index:40; max-width:min(640px,calc(100vw - 32px)); display:flex; align-items:center; gap:10px; padding:10px 10px 10px 16px; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 50px var(--shadow); font-family:var(--mono); font-size:12px; color:var(--muted); }
.toast b { color:var(--ink); font-weight:500; } .toast .err { color:var(--coral); }
.toast .x { width:26px; height:26px; flex:none; }
/* landing */
.land { max-width:1120px; margin:0 auto; padding:clamp(40px,8vw,88px) 0 120px; display:grid; gap:56px; }
.land-top { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:40px 56px; align-items:center; }
.land-top h1 { font-size:clamp(34px,5vw,54px); font-weight:800; letter-spacing:-.04em; line-height:1.02; margin:0; text-wrap:balance; }
.land-top .lede { font-size:15.5px; color:var(--muted); max-width:46ch; margin:0; line-height:1.6; }
.land-copy { display:grid; gap:18px; }
.land-copy .eyebrow { display:flex; align-items:center; gap:10px; }
.land-copy .eyebrow i { width:8px; height:8px; border-radius:50%; background:var(--dim); }
.drop { min-height:340px; border:1.5px dashed var(--line2); border-radius:24px; padding:32px; display:grid; align-content:center; transition:border-color .15s, background .15s; }
.drop.drag { border-color:var(--amber); background:var(--amberBg); }
.drop.bad { border-color:var(--coral); }
.drop .center { display:grid; justify-items:center; text-align:center; gap:18px; }
.drop .t { font-size:19px; font-weight:800; letter-spacing:-.01em; }
.drop .big { font-size:26px; font-weight:800; letter-spacing:-.025em; overflow-wrap:anywhere; }
.drop .small { font-family:var(--mono); font-size:11px; color:var(--muted); max-width:36ch; line-height:1.6; }
.drop .rows { display:grid; font-family:var(--mono); font-size:12px; border-top:1px solid var(--line); }
.drop .rows div { display:grid; grid-template-columns:96px minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
.drop .rows span:first-child { color:var(--muted); }
.drop .steps { display:grid; gap:10px; font-family:var(--mono); font-size:12.5px; }
.drop .steps div { display:grid; grid-template-columns:18px minmax(0,1fr); gap:10px; }
.drop .acts { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.linkbtn { font:inherit; font-family:var(--mono); font-size:12px; color:var(--muted); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.linkbtn:hover { color:var(--ink); }
.land-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); border-top:1px solid var(--line); }
.land-steps div { display:grid; gap:6px; padding:20px 24px 0 0; align-content:start; }
.land-steps b { font-family:var(--mono); font-size:11px; color:var(--amber); font-weight:600; }
.land-steps strong { font-size:15px; font-weight:800; }
.land-steps span { font-size:13.5px; color:var(--muted); line-height:1.55; }
.land-h { font-size:clamp(22px,2.8vw,30px); font-weight:800; letter-spacing:-.03em; margin:0 0 6px; text-wrap:balance; }
.land-sub { margin:0 0 22px; color:var(--muted); font-size:15px; max-width:60ch; line-height:1.55; }
.land-prob { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:14px; }
.land-prob div { padding:18px 20px; border:1px solid var(--line); border-radius:18px; background:var(--surface); display:grid; gap:6px; align-content:start; }
.land-prob strong { font-size:16px; font-weight:800; letter-spacing:-.01em; }
.land-prob span { font-size:13.5px; color:var(--muted); line-height:1.55; }
.land-steps b { color:var(--violet); }
.land-demo { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px 32px; padding:22px 24px; background:var(--surface); border:1px solid var(--line); border-radius:20px; }
.land-demo .t { font-size:18px; font-weight:800; display:block; margin:4px 0; }
.land-demo .s { font-family:var(--mono); font-size:12px; color:var(--muted); }
/* landing v3: visual marketing page */
.land { gap:clamp(72px,10vw,120px); }
.land-top { position:relative; }
.land-top::before { content:""; position:absolute; inset:-120px -10% auto auto; width:min(720px,90vw); height:560px; background:radial-gradient(closest-side,color-mix(in srgb,var(--amber) 22%,transparent),transparent 70%),radial-gradient(closest-side at 70% 60%,color-mix(in srgb,var(--violet) 20%,transparent),transparent 70%); filter:blur(10px); z-index:-1; pointer-events:none; }
.land-top h1 { font-size:clamp(40px,6.4vw,76px); line-height:.98; }
.land-top h1 em { font-style:normal; background:linear-gradient(100deg,var(--amber),var(--coral) 60%,var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.land-top .lede { font-size:17px; }
.land-cta { display:flex; flex-wrap:wrap; gap:10px; }
.land-cta .btn { font-size:13px; padding:11px 20px; }
.lv { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px -30px var(--shadow); overflow:hidden; }
.lv-h { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); font-weight:800; font-size:15px; }
.lv-h .dots { display:flex; gap:6px; margin-right:6px; } .lv-h .dots i { width:9px; height:9px; border-radius:50%; background:var(--line2); }
.lv-h small { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:500; }
.lv-h small b { color:var(--coral); font-weight:600; }
.lv-rows { display:grid; padding:8px 0; }
.lv-r { display:flex; align-items:center; gap:10px; padding:9px 18px; font-size:14px; position:relative; }
.lv-r[data-d="1"] { padding-left:40px; } .lv-r[data-d="2"] { padding-left:64px; }
.lv-r[data-d="1"]::before, .lv-r[data-d="2"]::before { content:""; position:absolute; top:0; bottom:0; left:28px; border-left:1px solid var(--line2); }
.lv-r[data-d="2"]::before { left:52px; }
.lv-r span { flex:1; min-width:0; }
.tg { font-style:normal; }
.lv-r .tg { flex:none; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
.tg.bad { background:color-mix(in srgb,var(--coral) 16%,transparent); color:var(--coral); }
.tg.odd { background:var(--amberBg); color:var(--amber); }
.tg.ok { color:var(--mint); background:color-mix(in srgb,var(--mint) 12%,transparent); }
.lv-r.bad { background:color-mix(in srgb,var(--coral) 8%,transparent); box-shadow:inset 3px 0 0 var(--coral); font-weight:600; }
.lv-r.odd { box-shadow:inset 3px 0 0 var(--amber); }
.lv-r.q { font-weight:700; }
.land-h { font-size:clamp(28px,4vw,44px); letter-spacing:-.035em; line-height:1.05; }
.land-sub { font-size:17px; }
.land-vs { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:20px; align-items:center; }
.land-vs .arrow { font-size:28px; color:var(--amber); font-weight:800; }
.lv-cap { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; gap:10px; }
.lv-code { padding:16px 18px; display:grid; gap:7px; filter:blur(.6px); opacity:.75; }
.lv-code i { display:block; height:8px; border-radius:4px; background:var(--line2); }
.lv-files { display:flex; gap:6px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); }
.lv-files span { font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--surface2); border-radius:6px; padding:2px 8px; }
.land-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:18px; }
.land-tile { padding:24px; display:grid; gap:10px; align-content:start; }
.land-tile b { font-family:var(--mono); font-size:11px; color:var(--violet); }
.land-tile strong { font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
.land-tile p { margin:0; font-size:14px; color:var(--muted); }
.lt-vis { height:150px; border-radius:14px; background:var(--surface2); margin-bottom:8px; display:grid; place-items:center; padding:14px; }
.lt-rows { display:grid; gap:7px; width:100%; }
.lt-rows .tg { font-size:9.5px; padding:2px 7px; border-radius:999px; font-family:var(--mono); text-transform:uppercase; }
.lt-rows div { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface); border-radius:8px; padding:6px 10px; font-size:12px; }
.lt-layers { display:grid; gap:6px; width:100%; justify-items:center; }
.lt-layers .l { width:100%; display:flex; gap:6px; }
.lt-layers .l span { flex:1; text-align:center; font-family:var(--mono); font-size:10.5px; padding:5px 0; border-radius:6px; }
.c-v { background:var(--violetBg); color:var(--violet); } .c-a { background:var(--amberBg); color:var(--amber); } .c-m { background:color-mix(in srgb,var(--mint) 14%,transparent); color:var(--mint); }
.lt-layers .one { width:100%; background:var(--surface); border-radius:8px; padding:7px 10px; font-size:12px; display:flex; gap:8px; align-items:center; }
.lt-layers .one i { width:8px; height:8px; border-radius:50%; flex:none; }
.lt-struct { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; width:100%; }
.lt-grid { display:grid; gap:3px; height:64px; }
.lt-grid i { background:var(--line2); border-radius:3px; }
.lt-same { grid-column:1/-1; justify-self:center; font-family:var(--mono); font-size:11px; padding:5px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--amber); color:var(--ink); }
.land-end { position:relative; overflow:hidden; border-radius:28px; padding:clamp(28px,5vw,56px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:32px; align-items:center; background:linear-gradient(135deg,#14181D,#221a2e 55%,#2e1d14); color:#EEF1F4; }
.land-end h2 { font-size:clamp(28px,4vw,44px); font-weight:800; letter-spacing:-.035em; line-height:1.05; margin:0 0 12px; }
.land-end p { margin:0; color:#B9C0C8; font-size:15px; }
.land-end .drop { min-height:220px; border-color:#3D444E; background:rgba(255,255,255,.03); color:#EEF1F4; }
.land-end .drop .small { color:#9AA3AE; }
@media (max-width:720px) { .land-vs { grid-template-columns:minmax(0,1fr); } .land-vs .arrow { justify-self:center; transform:rotate(90deg); } }
/* gradient look, colours from the Review Bench design (v19) */
body { overflow-x:clip; }
body:has(#land) #main { background-image:radial-gradient(ellipse 50% 60% at 22% 30%,var(--glowA),transparent 70%),radial-gradient(ellipse 45% 55% at 82% 20%,var(--glowV),transparent 70%),linear-gradient(var(--gridLn) 1px,transparent 1px),linear-gradient(90deg,var(--gridLn) 1px,transparent 1px); background-size:100% 900px,100% 900px,48px 48px,48px 48px; background-repeat:no-repeat,no-repeat,repeat,repeat; background-position:center top; }
.land { --ai:linear-gradient(110deg,var(--amber),var(--coral) 55%,var(--violet)); }
.land-top::before { display:none; }
.land-top h1 em { background:var(--ai); -webkit-background-clip:text; background-clip:text; }
.land .btn.primary { box-shadow:0 10px 30px -12px var(--amber); }
.land-top .lv, .land-vs > div:last-child .lv { border:1px solid transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--ai) border-box; box-shadow:0 40px 100px -40px var(--shadow); }
.land-vs .arrow { background:var(--ai); -webkit-background-clip:text; background-clip:text; color:transparent; font-size:40px; }
.land-h .g { background:var(--ai); -webkit-background-clip:text; background-clip:text; color:transparent; }
.land-tile b { color:var(--violet); font-size:13px; }
.land-tile .lt-vis { background:linear-gradient(120deg,var(--violetBg),var(--surface2) 70%); }
.lt-same { border-color:transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--ai) border-box; }
.land-end { background:linear-gradient(120deg,var(--violetBg),var(--surface) 55%); border:1px solid var(--line); color:var(--ink); }
.land-end p { color:var(--muted); }
.land-end .drop { border-color:var(--line2); background:var(--surface); color:var(--ink); }
.land-end .drop .small { color:var(--muted); }
.btn.ink { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; }
.progress b { color:var(--ink); font-weight:500; }
.progress .am { color:var(--amber); }

/* source bar */
.source { border-bottom:1px solid var(--line); }
.source .wrap { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding-block:12px; }
.btn { font-family:var(--mono); font-size:12px; cursor:pointer; padding:7px 14px; border-radius:999px; border:1px solid var(--line2); background:var(--surface2); color:var(--ink); display:inline-flex; align-items:center; gap:8px; }
.btn:hover { border-color:var(--amber); }
.btn.primary { background:var(--amber); color:#14181D; border-color:var(--amber); font-weight:600; }
.btn.primary:hover { filter:brightness(1.08); }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.btn input { display:none; }
.status { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:0; flex:1 1 280px; }
.status b { color:var(--ink); font-weight:500; }
.status .err { color:var(--coral); }
.spinner { display:inline-block; width:10px; height:10px; border-radius:50%; border:2px solid var(--line2); border-top-color:var(--amber); animation:spin .8s linear infinite; vertical-align:-1px; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation:none; } * { transition:none !important; } }

/* tabs */
.tabs { display:inline-flex; flex-wrap:wrap; align-items:center; gap:2px; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--surface2); }
.tabs .div { width:1px; align-self:stretch; background:var(--line2); margin:4px 6px; }
.tabs.mini { margin:0 0 6px; }
.tabs.mini button { font-size:11.5px; padding:4px 12px; }
.tabs button { font-family:var(--mono); font-size:12.5px; padding:6px 16px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
.tabs button:hover { color:var(--ink); }
.tabs button[aria-selected="true"] { background:var(--ink); color:var(--bg); }
.tabs .dot { width:6px; height:6px; border-radius:50%; background:var(--dim); }
.tabs .dot.done { background:var(--mint); }

/* hero */
main { padding-block:40px 120px; transition:padding-right .32s; }
/* wide screens: the detail slides in from the right over the page and nothing behind it moves. Narrow screens (≤980px): it sits under the tree. */
body.col-sheet .wrap, body.col-sheet header.top .wrap { max-width:none; }
body.col-sheet main { padding-right:0; }
/* the detail grows with the window and reads as the tree's right half: same panel, no gap, no shadow */
body.col-sheet .flowgrid { grid-template-columns:360px minmax(520px,1.25fr) minmax(400px,1fr); column-gap:0; }
body.col-sheet .rail { margin-right:24px; }
body.col-sheet #tree { border-top-right-radius:0; border-bottom-right-radius:0; }
body.col-sheet aside.sheet { position:sticky; top:var(--stickTop,140px); right:auto; bottom:auto; max-height:calc(100vh - var(--stickTop,140px) - 16px); width:auto; transform:none; visibility:visible; z-index:1; transition:none;
  background:var(--surface); backdrop-filter:none; box-shadow:none; border:1px solid var(--line); border-left:0; border-radius:0 18px 18px 0; }
body.col-sheet .trow.sel { box-shadow:inset -3px 0 0 var(--violet); }
.cases.above { display:none; margin:0 0 10px; }
.caseline .wh-tree { display:none; }
@media (max-width:1439px) {
  body.col-sheet .flowgrid { grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr); }
  body.col-sheet .rail { display:none; }
  body.col-sheet .cases.above { display:flex; }

/* screen mock */

.device.web .dev-bar i { width:8px; height:8px; border-radius:50%; }
.scr-h { display:flex; align-items:baseline; gap:14px; padding:2px 4px 10px; font-size:13px; font-weight:700; }

.scr-row { display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 8px; margin:2px 0; border-left:3px solid var(--zc,var(--line2)); border-radius:3px 10px 10px 3px; background:color-mix(in srgb,var(--surface2) 60%,transparent); font-size:13px; transition:opacity .15s; }
.scr-row[data-nodes], .scr-row[data-case] { cursor:pointer; }

.scr-row .gl { font-family:var(--mono); font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
.scr-row .tx { min-width:0; overflow-wrap:anywhere; font-weight:600; }
.scr-row .mt { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; }
.scr-row .qty { font-family:var(--mono); font-size:11px; font-weight:600; padding:0 7px; border-radius:999px; background:var(--surface); border:1px solid var(--line2); color:var(--ink); }
.scr-row.accent { --zc:var(--coral); } .scr-row.accent .mt { color:var(--coral); }
.scr-row.warn { --zc:var(--amber); } .scr-row.warn .tx { color:var(--amber); }
.tfilter { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 10px; }
.tfilter input { flex:1 1 260px; min-width:0; font:inherit; font-size:14px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:var(--surface); color:var(--ink); }
.tfilter input:focus { outline:2px solid var(--violet); outline-offset:-1px; }
.tfilter .fc { font-family:var(--mono); font-size:12px; color:var(--muted); }
.tfilter .fo { font-size:12.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.tfilter .fo button { font:inherit; font-size:12px; font-family:var(--mono); border:1px solid var(--line2); background:transparent; color:var(--ink); border-radius:999px; padding:2px 10px; cursor:pointer; }
#tree .trow.fhit, #tree .nrow.fhit { background:var(--amberBg); box-shadow:inset 3px 0 0 var(--amber); }
#tree mark.fm { background:color-mix(in srgb,var(--amber) 45%,transparent); color:inherit; border-radius:3px; padding:0 1px; }
.caseline { font-size:13px; color:var(--muted); margin:0 0 8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

.scr-row.dim { --zc:var(--dim); } .scr-row.dim .tx { color:var(--muted); font-weight:500; }

.scr-cap { margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--muted); }
.record { display:grid; grid-template-columns:32px minmax(0,1fr); gap:14px; }
.panel.recordp { margin-top:14px; background:linear-gradient(135deg,var(--amberBg),var(--surface) 60%); }
.record .ic { width:32px; height:32px; border-radius:50%; background:var(--amberBg); color:var(--amber); display:grid; place-items:center; border:1px solid color-mix(in srgb,var(--amber) 40%,transparent); }
.record h4 { margin:2px 0 0; font-size:15px; }

.record .intent { font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:6px; }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.legend span { font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
.legend span.be { color:var(--violet); border-color:var(--violet); }
.empty { text-align:center; padding:48px 20px; color:var(--muted); }

.stream { font-family:var(--mono); font-size:11px; color:var(--dim); max-height:120px; overflow:hidden; text-align:left; margin:16px auto 0; max-width:560px; white-space:pre-wrap; word-break:break-all; mask-image:linear-gradient(transparent, #000 60%); }

/* sheet */
aside.sheet { position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; bottom:12px; z-index:30; width:min(560px,calc(100vw - 24px)); background:var(--glass); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px var(--shadow); display:flex; flex-direction:column; overflow:hidden; transform:translateX(110%); visibility:hidden; transition:transform .32s cubic-bezier(.22,.8,.3,1), visibility .32s; }
aside.sheet.open { transform:none; visibility:visible; }
.sheet-h { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 12px 22px; border-bottom:1px solid var(--line); }
.x { width:32px; height:32px; border-radius:999px; border:1px solid var(--line); background:var(--surface2); cursor:pointer; }
.x:hover { border-color:var(--amber); }

.box { background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; }
.box .eyebrow { font-size:10px; color:var(--amber); display:block; margin-bottom:4px; }
.signbtns { display:flex; gap:6px; flex-wrap:wrap; }
.signbtns button { font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--line2); background:transparent; cursor:pointer; }
.signbtns button[aria-pressed="true"].s1 { background:var(--mint); color:#14181D; border-color:var(--mint); }
.signbtns button[aria-pressed="true"].s2 { background:var(--coral); color:#14181D; border-color:var(--coral); }
.signbtns button[aria-pressed="true"].s0 { background:var(--surface2); }
pre.code { margin:0; font-family:var(--mono); font-size:11.5px; line-height:1.7; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 0; overflow-x:auto; max-height:420px; }
pre.code .ln { display:block; padding:0 14px 0 0; white-space:pre; }

pre.code .ln.hl { background:var(--amberBg); }
.ask { display:flex; gap:8px; }
.ask input { flex:1; min-width:0; font:inherit; font-size:14px; padding:8px 12px; border-radius:10px; border:1px solid var(--line2); background:var(--bg); color:var(--ink); }
.answer { white-space:pre-wrap; font-size:14px; }
.turns { display:grid; gap:8px; margin-bottom:10px; }
.turn { font-size:14px; padding:8px 12px; border-radius:12px; max-width:95%; }
.turn.you { background:var(--surface2); justify-self:end; border-bottom-right-radius:4px; }
.turn.cl { background:var(--violetBg); border-bottom-left-radius:4px; white-space:pre-wrap; }
.turn .touch { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; white-space:normal; }
.cite { display:inline-block; } .turn .side { margin-top:6px; color:var(--muted); font-size:13px; white-space:normal; }
.cite { font-family:var(--mono); font-size:11px; background:var(--surface); border:1px solid var(--line2); border-radius:6px; padding:1px 6px; }
.turn details { margin-top:6px; } .turn summary { cursor:pointer; font-size:13px; color:var(--muted); } .turn pre.code { font-size:11px; max-height:260px; overflow:auto; margin-top:6px; }
.story { display:grid; gap:10px; }
.story .row { display:grid; grid-template-columns:118px minmax(0,1fr); gap:10px; align-items:baseline; }
.story .row .eyebrow { margin:0; }
.story .row.ntc { padding-top:10px; border-top:1px dashed var(--line); }
.story .row.ntc span:last-child { font-weight:600; }
@media (max-width:520px) { .story .row { grid-template-columns:1fr; gap:2px; } }
button.term { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:help; text-decoration:underline dotted; text-decoration-color:var(--amber); text-underline-offset:3px; text-decoration-thickness:1.5px; }
button.term[aria-expanded="true"] { background:color-mix(in srgb,var(--amber) 18%,transparent); border-radius:3px; }
.termdef { border-left:3px solid var(--amber); }
.sheet-b h2.mdl { color:var(--violet); } .sheet-b h2.flg { color:var(--amber); } .sheet-b h2.ag { color:var(--coral); }
.box.now { border-color:var(--mint); background:color-mix(in srgb,var(--mint) 8%,var(--surface2)); }
.box.now .eyebrow { color:var(--mint); }
pre.prompt { margin:0; font-family:var(--mono); font-size:11.5px; line-height:1.6; white-space:pre-wrap; background:var(--violetBg); color:var(--ink); border:1px solid color-mix(in srgb,var(--violet) 40%,transparent); border-radius:12px; padding:12px 14px; max-height:300px; overflow:auto; }
.minitree { font-family:var(--mono); font-size:12px; line-height:1.8; }
.minitree div { display:flex; gap:8px; cursor:pointer; border-radius:6px; padding:0 4px; }
.minitree div:hover { background:var(--hi); }
.minitree i { font-style:normal; width:12px; flex:none; text-align:center; }
.minitree .pre { white-space:pre; color:var(--dim); }
.lives { font-family:var(--mono); font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; }
.lives b { color:var(--ink); font-weight:500; }
.footnote { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; max-width:72ch; }

/* landing: picker under the hero buttons, whole-page drop */
.land-pick { margin:14px 0 0; font-size:13px; color:var(--muted); } .land-pick .linkbtn { font-size:13px; }
.land-safe { margin:18px 0 0; display:flex; gap:10px; align-items:flex-start; max-width:48ch; padding:10px 14px; border-radius:14px; border:1px solid var(--line); background:color-mix(in srgb,var(--surface) 70%,transparent); font-size:13px; line-height:1.5; color:var(--muted); }
.land-safe svg { flex:none; margin-top:2px; color:var(--mint); } .land-safe b { color:var(--ink); }
.land.drag::after { content:'Drop to open your code'; position:fixed; inset:12px; z-index:50; display:grid; place-items:center; border:2px dashed var(--violet); border-radius:28px; background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:blur(6px); font-size:22px; font-weight:800; color:var(--ink); pointer-events:none; }
/* landing in focus: the progress card is the only thing on the page */
@property --rb-a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
@keyframes rbSpin { to { --rb-a:360deg; } }
@keyframes rbPulse { from { opacity:.55; transform:scale(.96); } to { opacity:1; transform:scale(1.04); } }
@keyframes rbIn { from { opacity:0; transform:translateY(24px) scale(.94); } to { opacity:1; transform:none; } }
@keyframes rbAway { to { opacity:0; transform:translateY(28px); filter:blur(6px); visibility:hidden; } }
@media (max-width:820px) { .land.focus { overflow-x:clip; } }
.land.focus .land-cta, .land.focus .land-pick { opacity:.35; pointer-events:none; transition:opacity .4s; }
.land.focus .land-top { min-height:calc(100vh - 200px); align-content:center; }
.land.focus .land-top::before { display:none; }
.land.focus > section:not(.land-top) { animation:rbAway .55s ease forwards; }
.land.focus.settled > section:not(.land-top) { display:none; }
.land.focus .drop-wrap { position:relative; isolation:isolate; width:100%; }
.land.focus.enter .drop-wrap:not(.flip) { animation:rbIn .7s cubic-bezier(.2,.8,.2,1) .15s both; }
.land.focus .drop-wrap::before { content:''; position:absolute; inset:-48px; z-index:-1; border-radius:80px; background:radial-gradient(closest-side,color-mix(in srgb,var(--violet) 40%,transparent),transparent); filter:blur(30px); opacity:.35; animation:rbPulse 2.6s ease-in-out infinite alternate; }
.land.focus .drop { position:relative; min-height:0; border:0; background:var(--surface); border-radius:24px; padding:clamp(24px,4vw,36px); box-shadow:0 40px 120px -40px var(--shadow); }
.land.focus .drop::before { content:''; position:absolute; inset:-1.5px; z-index:-1; border-radius:25.5px; background:conic-gradient(from var(--rb-a),var(--line) 0 70%,color-mix(in srgb,var(--violet) 70%,var(--coral)) 85%,var(--line) 100%); animation:rbSpin 2.8s linear infinite; }
.land.focus .drop.bad::before { background:var(--coral); animation:none; }
.land.focus .drop .stream { mask-image:linear-gradient(transparent,#000 60%); -webkit-mask-image:linear-gradient(transparent,#000 60%); }
/* no card: the progress sits right on the page's grid and glow */
.land.focus .drop { background:transparent; box-shadow:none; border-radius:0; padding:0; }
.land.focus .drop::before { display:none; }
.land.focus .drop .big { font-size:clamp(28px,3.4vw,40px); letter-spacing:-.035em; }
.land.focus .drop .steps { font-size:14px; gap:12px; }
.land.focus .drop .stream { background:transparent; border:0; padding:0; height:120px; display:flex; flex-direction:column; justify-content:flex-end; } /* fixed height: streaming text must not move the page */
.land.focus .drop-wrap::before { inset:-80px; opacity:.45; }
@media (prefers-reduced-motion: reduce) { .land.focus *, .land.focus *::before { animation:none !important; } .land.focus > section:not(.land-top) { display:none; } }
.land-tree { position:absolute; inset:-70px -24px -40px; width:calc(100% + 48px); height:calc(100% + 110px); z-index:-1; pointer-events:none; -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.55) 40%,#000 70%); mask-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.55) 40%,#000 70%); }
@media (max-width:820px) { .land-tree { inset:-40px 0 -20px; width:100%; height:calc(100% + 60px); } }
/* ---------- realistic screens: phone and browser frames, labels on hover ---------- */
.device.real { border:0; border-radius:0; background:none; box-shadow:none; padding:0; }
.device.real .dev-bar { display:none; }
.rphone { width:100%; max-width:380px; margin:0 auto; border-radius:46px; padding:10px; background:#0d0f12; box-shadow:0 0 0 1.5px #2b3038, 0 30px 70px -20px var(--shadow); }
.rphone .rscr { background:var(--rbg); border-radius:37px; overflow:hidden; position:relative; padding:0 0 22px; color:var(--rink); }
.rweb { width:100%; border-radius:14px; overflow:hidden; border:1px solid var(--line2); box-shadow:0 30px 70px -24px var(--shadow); background:var(--rbg); color:var(--rink); }
.rscr, .rweb { --rbg:#F2F2F7; --rcard:#FFFFFF; --rink:#111418; --rmut:#8A8F98; --rsep:#E3E4E8; --racc:#0A84FF; font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif; }
:root:not([data-theme="light"]) .rscr, :root:not([data-theme="light"]) .rweb { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rscr, :root:not([data-theme="light"]) .rweb { --rbg:#000; --rcard:#1C1C1E; --rink:#F2F2F7; --rmut:#8E8E93; --rsep:#2C2C2E; } }
:root[data-theme="dark"] .rscr, :root[data-theme="dark"] .rweb { --rbg:#000; --rcard:#1C1C1E; --rink:#F2F2F7; --rmut:#8E8E93; --rsep:#2C2C2E; }
.rstat { display:flex; justify-content:space-between; align-items:center; padding:14px 26px 6px; font-size:14px; font-weight:600; }
.rstat .isl { width:96px; height:28px; border-radius:20px; background:#000; }

/* ---------- sequence diagram for backend flows ---------- */
.seq { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 12px 16px; }

section.concepts > div:first-child { margin-bottom:6px; }
.decs .step-h, .promises-p .step-h { margin-bottom:10px; }
.tabs .ring { flex:none; } .tabs .ring .bg { fill:none; stroke:var(--line2); stroke-width:2.5; } .tabs .ring .fg { fill:none; stroke:var(--mint); stroke-width:2.5; stroke-linecap:round; }
.tabs .ring.none .bg { stroke-dasharray:2 2.4; }
.journeys { display:grid; gap:16px; margin:36px 0 28px; }

.jp.seqmini span { font-weight:700; background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:4px 8px; }

.jcard .jt { font-weight:800; font-size:15.5px; line-height:1.3; letter-spacing:-.01em; min-height:2.6em; } /* two lines kept free so previews line up across cards */
.jcard .js { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.jcard .js b { color:var(--amber); font-weight:600; }
.jbar { height:5px; border-radius:5px; background:var(--line); overflow:hidden; } .jbar i { display:block; height:100%; background:var(--mint); }
.jcard .jd { font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:-4px; }
.tabs .tlab { font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); padding:0 6px 0 4px; }

/* ---------- Overview: progress rail on the left, the four steps as one column of equal cards ---------- */
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.btn.ghost { background:transparent; }
.ov { --g:linear-gradient(90deg,#F5B544,#FF7A6B 50%,#B59CFF); display:grid; grid-template-columns:248px minmax(0,1fr); gap:28px; align-items:start; margin-top:18px; }
.ov-rail { position:sticky; top:var(--stickTop,120px); display:grid; gap:14px; padding:18px; border:1px solid var(--line); border-radius:20px; background:var(--surface); }
.ov-prog { display:grid; grid-template-columns:72px 1fr; gap:14px; align-items:center; position:relative; }
.ov-prog svg { grid-row:1; grid-column:1; }

.ov-prog .bg { fill:none; stroke:var(--line); stroke-width:7; } .ov-prog .fg { fill:none; stroke:url(#ovg); stroke-width:7; stroke-linecap:round; }
.ov-prog div { display:grid; line-height:1.3; } .ov-prog .eyebrow { font-size:9.5px; margin-bottom:4px; }
.ov-prog strong { font-size:20px; font-weight:800; letter-spacing:-.02em; } .ov-prog div span:last-child { font-size:13px; color:var(--muted); }
.ov-facts { display:flex; flex-wrap:wrap; gap:6px; }
.ov-facts span { font-size:12px; color:var(--muted); background:var(--surface2); border-radius:999px; padding:3px 10px; }
.ov-facts b { color:var(--ink); } .ov-facts b.hot { color:var(--amber); } .ov-facts b.bad { color:var(--coral); }
.ov-steps { display:grid; gap:2px; border-top:1px solid var(--line); padding-top:12px; position:relative; }
.ov-steps button { font:inherit; color:var(--muted); background:none; border:0; border-radius:12px; padding:8px; display:flex; gap:12px; align-items:center; text-align:left; cursor:pointer; position:relative; }
.ov-steps button:hover { background:var(--surface2); color:var(--ink); }
.ov-steps button b { flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; border:1.5px solid var(--line2); background:var(--surface); color:var(--muted); position:relative; z-index:1; }
.ov-steps button:not(:last-child)::after { content:''; position:absolute; left:20.5px; top:36px; height:calc(100% - 26px); width:1.5px; background:var(--line); }
.ov-steps button span { display:grid; font-size:14px; font-weight:600; line-height:1.3; } .ov-steps small { font-family:var(--mono); font-size:11px; font-weight:400; color:var(--muted); }
.ov-steps button.on { color:var(--ink); background:var(--surface2); }
.ov-steps button.on b { border-color:var(--ink); color:var(--bg); background:var(--ink); }
.ov-hood { justify-self:start; font-size:11.5px; }
.ov-main { min-width:0; display:grid; gap:20px; }
.ov-hero { position:relative; overflow:hidden; padding:28px 30px; border-radius:20px; border:1px solid var(--line); background:var(--surface); }
.ov-hero::before { content:''; position:absolute; inset:-40% -10% auto 45%; height:180%; background:radial-gradient(closest-side,color-mix(in srgb,#FF7A6B 22%,transparent),transparent), radial-gradient(closest-side at 70% 60%,color-mix(in srgb,#B59CFF 26%,transparent),transparent); pointer-events:none; }
.ov-hero > * { position:relative; }
.ov-hero h1 { margin:8px 0 8px; font-size:clamp(28px,3.4vw,40px); line-height:1.08; letter-spacing:-.035em; font-weight:800; text-wrap:balance; max-width:22ch; }
.ov-hero p { margin:0; color:var(--muted); max-width:62ch; } .ov-hero .ov-trace { margin-top:12px; } .ov-hero .ov-trace.warn { color:var(--coral); }
.ov-main > .since { margin:0; }
.step { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px 26px 26px; min-width:0; display:grid; gap:18px; margin:0; scroll-margin-top:calc(var(--stickTop,120px) + 12px); }
.sh { display:flex; justify-content:space-between; align-items:flex-end; gap:12px 24px; flex-wrap:wrap; }
.sh-l { flex:1 1 380px; min-width:0; }
.sh-n { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; background:var(--g); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sh h2 { margin:4px 0 0; font-size:clamp(21px,2.2vw,26px); font-weight:800; letter-spacing:-.025em; line-height:1.2; }
.sh p { margin:6px 0 0; color:var(--muted); font-size:14.5px; max-width:64ch; }
.sh-r { flex:none; }
/* step 1 */
.concepts .cwrap { grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:24px; }
.concepts .cwrap.web { grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr); }
.concepts .cwrap.nosk { grid-template-columns:1fr; }
.cstage { border-radius:16px; background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,#B59CFF 14%,transparent),transparent 70%),var(--surface2); padding:22px; display:grid; place-items:center; }
.cstage .device { margin:0; width:100%; }
.concepts .cside { padding-top:0; gap:16px; }
.cgrp { display:grid; gap:2px; }
.cgh { font-size:12px; font-weight:700; color:var(--muted); padding:0 10px 4px; }
.cline { font:inherit; color:inherit; text-align:left; background:none; border:0; border-radius:12px; padding:8px 10px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
.cline > i { flex:none; width:10px; height:10px; border-radius:50%; background:var(--cc); margin-top:6px; box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 20%,transparent); }
.cline > span { display:grid; min-width:0; flex:1; } .cline b { font-size:14.5px; font-weight:700; }
.cline small { font-size:13px; color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cline em { flex:none; font-style:normal; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap; }
.cline:hover, .cline.on { background:color-mix(in srgb,var(--cc) 12%,var(--surface)); }
.cline.on b { color:var(--ink); }
.concepts .cnote { margin:0; padding:12px 14px; border-radius:14px; background:var(--surface2); font-size:13.5px; color:var(--muted); min-height:0; }
.concepts .cnote:has(.pk-h) { background:var(--surface); border:1.5px solid var(--ink); color:var(--ink); }
.ck-n { color:var(--amber); font-weight:500; }
@media (max-width:860px) { .concepts .cwrap, .concepts .cwrap.web { grid-template-columns:1fr; } }
/* step 2 */
.journeys { margin:0; gap:18px; } .journeys .jgrid { grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr)); }
.rseg .hs-p[data-cname]:hover::after { top:50%; transform:translateY(-50%); }
/* step 3 */
.dmeter { display:grid; gap:6px; min-width:240px; }
.dbar { height:8px; border-radius:8px; background:var(--line); overflow:hidden; display:flex; }
.dbar i { display:block; height:100%; } .dbar i.k { background:var(--mint); } .dbar i.c { background:var(--violet); }
.dleg { display:flex; gap:12px; font-family:var(--mono); font-size:11px; color:var(--muted); }
.dleg i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line2); margin-right:5px; } .dleg i.k { background:var(--mint); } .dleg i.c { background:var(--violet); }
.decs .dec-l { gap:18px; }
.dgrp { display:grid; gap:8px; --gc:var(--muted); } .dgrp.g-bug { --gc:var(--coral); } .dgrp.g-look { --gc:var(--violet); }
.dgh { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.dgh b { font-size:15px; font-weight:800; color:var(--gc); } .dgh span { font-size:13px; color:var(--muted); }
.dgh em { font-style:normal; margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--gc); background:color-mix(in srgb,var(--gc) 12%,transparent); border-radius:999px; padding:1px 9px; }
.decs .dec { display:flex; gap:16px; align-items:flex-start; padding:14px 16px 14px 18px; border:1px solid var(--line); border-radius:14px; background:var(--surface); position:relative; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
.decs .dec::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gc); }
.decs .dec:hover { border-color:var(--line2); box-shadow:0 14px 34px -26px var(--shadow); }
.dec-b { flex:1; min-width:0; display:grid; gap:6px; }
.decs .dec-t { font-size:15px; font-weight:700; line-height:1.4; letter-spacing:-.005em; }
.decs .dec-n { font-size:13.5px; color:var(--ink); background:var(--surface2); border-radius:10px; padding:7px 10px; line-height:1.45; }
.decs .dec-n span { display:block; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.dec-m { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; } .dec-m .linkbtn { font-size:11px; }
.dj { font-family:var(--mono); font-size:11px; display:inline-flex; align-items:center; gap:6px; color:var(--ink); }
.dj::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--fc); }
.decs .dec-a { flex:none; display:flex; gap:6px; margin:0; align-items:center; }
.decs .more { justify-self:center; }
@media (max-width:640px) { .decs .dec { flex-direction:column; } .decs .dec-a { align-self:stretch; } .decs .dec-a .btn { flex:1; justify-content:center; } }

<script>

// ---------- demo data: none here; tools/claude-ai.mjs adds a demo for the claude.ai version ----------
const DEMO = null;

// ---------- state ----------
// the Overview and search views: names no journey can have (journey ids are letters, digits, - and _)
const OV = '@overview', USES = '@search';
const st = {
  proj: null,          // analysis: {key, app, places, components, flows, demo?}
  files: null,         // Map path -> text (only for analyzed uploads, in memory)
  briefs: [],          // [{path,text}]
  view: OV,
  sel: null,           // {flow, idx}
  comp: null,
  review: {},
  ctl: null,

  cases: {},          // flow id -> pinned case id
  knobs: {},          // flow id -> {knob id: value}
  knobsOpen: {},
  tech: store.get('rb.tech', false),   // show plumbing rows in every tree
  unfold: {},          // flow id#section index -> plumbing shown for that section
  src: null,           // 'demo' | 'proj' | null (landing)
  phase: 'empty',      // landing: empty | reading | read | mapping | error
  read: null,
};
// window.RB_HOST / RB_AI: a host page (the VS Code extension) names itself and brings an AI with sample.json's shape
const HOST = window.RB_HOST || (window.claude && typeof window.claude.use === 'function' ? 'claude' : 'none');

const placeIdx = id => Math.max(0, st.proj.places.findIndex(p => p.id === id));
const flowIdx = id => st.proj.flows.findIndex(f => f.id === id);

function allDecisions() {
  const out = [];
  for (const f of st.proj.flows) (f.nodes || []).forEach((n, i) => { if (n.kind === 'decision') out.push({ f, n, i }); });

    if (k.fail) ok ? s.delete(k.fail) : s.add(k.fail);
  }
  return s;
}

  const v = { ...(c.values || {}) };
  for (const k of f.knobs || []) {
    const m = c.measures?.[k.id]; if (m == null || !k.op || !k.pass) continue;
    const ok = cmp(m, k.op, knobVal(f, k));

  }

}
function serverEntry() { const m = {}; st.proj.flows.forEach(f => { if (f.server && f.path?.[0]) m[f.path[0][0]] = f; }); return m; }
function compTag(c) { return c ? (c.tag || c.name.split(/\s+/)[0]).toUpperCase().slice(0, 12) : ''; }
function dominantComp(f) { const n = {}; (f.nodes || []).forEach(x => { if (x.comp) n[x.comp] = (n[x.comp] || 0) + 1; }); return Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0]; }
const provIcon = n => n.prov === 'unasked' ? '?' : n.prov === 'against' ? '✗' : n.prov === 'asked' ? '✓' : '';
const provText = n => n.prov === 'unasked' ? '? Not in the spec. The spec doesn’t mention it, so the AI or a developer made this call on their own.' : n.prov === 'against' ? '✗ Against the spec. The code does something the spec rules out.' : n.prov === 'asked' ? '✓ The spec asks for this.' : '';

// ---------- rendering ----------
function navHtml(mini) {
  const p = st.proj, user = p.flows.filter(f => !f.server), srv = p.flows.filter(f => f.server);

  const story = n.brief || n.notice;
  const rows = row('Spec says', n.brief || (n.briefRef ? '“' + n.briefRef + '”' : '')) + (story ? row('Code does', n.does || [n.q, n.a].filter(Boolean).join(' ▸ ')) : '') + row('What you’d notice', n.notice, 'ntc');

// free-form filter over the tree: the whole tree stays; matching lines light up and the words are marked

  window.RB_FILES.then(({ entries, label }) => readCode(entries.map(e => ({ path: e.path, size: e.size, read: async () => e.text })), label, 'folder'),
    () => setPhase('error', { err: 'empty' }));
}
// boot: where the viewer left off: the demo, their last analysis, or the landing page
const lastSrc = window.RB_FILES ? null : store.get('rb.src', null), saved = store.get('rb.proj', null);
if (lastSrc === 'demo') loadDemo();
else if (lastSrc === 'proj' && saved && saved.components) {
  st.proj = saved; st.src = 'proj'; st.review = store.get('rb.review.' + saved.key, {}); st.view = OV; render();
  setStatus(`Showing your last analysis, <b>${esc(saved.label || saved.app?.name)}</b>. Open the folder again (change, top left) to trace more flows or see source lines.`);
} else render();
})();
</script>
